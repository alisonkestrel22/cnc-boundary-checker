# Rebuilds data/projects.json whenever projects.csv changes, and every Monday so that
# changes organizers make to their project locations are picked up.
name: Update boundary data

on:
  push:
    branches: [main]
    paths:
      - projects.csv
      - lib/**
      - scripts/**
      - .github/workflows/update-data.yml
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write

# one build at a time; a later change waits for the running build instead of cancelling it
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      # full-precision boundaries from earlier runs, so only new or changed places are downloaded
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: boundaries-${{ github.run_id }}
          restore-keys: boundaries-

      - run: node scripts/build.mjs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: boundaries-${{ github.run_id }}

      # If someone saves a change from the page while this runs, these results are out of date:
      # start again from their change instead of pushing (the boundary cache makes a rebuild quick).
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/
            if git diff --cached --quiet; then
              echo "Boundary data unchanged"
              exit 0
            fi
            git commit -q -m "Update boundary data"
            if git push; then
              exit 0
            fi
            echo "The list changed while this was building; rebuilding from the latest version"
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/build.mjs
          done
          echo "The list kept changing during the build; the next run will catch up"
          exit 1
